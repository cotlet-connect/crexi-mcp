[project]
name = "crexi-mcp"
version = "1.0.0"
description = "Connect Crexi to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Crexi API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["crexi", "crexi api", "crexi mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/crexi-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=crexi"
Source = "https://github.com/cotlet-connect/crexi-mcp"

[project.scripts]
crexi-mcp = "crexi_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"crexi_agent.py" = "crexi_agent.py"

[tool.hatch.build.targets.sdist]
include = ["crexi_agent.py", "README.md", "LICENSE", "mcp.json", "skills", "examples", ".cursor"]
